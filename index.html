<!doctype html>

<html>
  <head>
    <meta charset="utf-8">
    <title>WebGPU Life</title>
  </head>
  <body>
    <canvas width="512" height="512"></canvas>
    <script type="module">
      const canvas = document.querySelector("canvas");

      if (!navigator.gpu) {
        throw new Error("WebGPU not supported on this browser.");
      }

      const adapter = await navigator.gpu.requestAdapter();
      if (!adapter) {
        throw new Error("No appropriate GPUAdapter found.");
      }

      const device = await adapter.requestDevice();

      const context = canvas.getContext("webgpu");
      const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
      context.configure({
        device: device,
        format: canvasFormat,
      });

      const vertices = new Float32Array([
        -0.5, -0.5, 0.0,
        -0.5, 0.5, 0.0,
        0.5, -0.5, 0.0,
        0.5, 0.5, 0.0,
      ]);

      const vertexBuffer = device.createBuffer({
        label: "Cell vertices",
        size: vertices.byteLength,
        usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST,
      });

      device.queue.writeBuffer(vertexBuffer, 0, vertices);

      const indices = new Uint16Array([
        0, 1, 2,
        1, 2, 3,
      ]);

      const indexBuffer = device.createBuffer({
        label: "Cell indices",
        size: indices.byteLength,
        usage: GPUBufferUsage.INDEX | GPUBufferUsage.COPY_DST,
      });

      device.queue.writeBuffer(indexBuffer, 0, indices);

      const vertexBufferLayout = {
        arrayStride: 12,
        attributes: [{
          format: "float32x3",
          offset: 0,
          shaderLocation: 0,
        }],
      };

      const cellShaderModule = device.createShaderModule({
        label: "Cell shader",
        code: /* wgsl */ `
          struct VertexOutput {
            @builtin(position) Position: vec4f,
            @location(0) fragColor: vec4f,
          };

          @vertex
          fn vertexMain(@location(0) pos: vec3f) -> VertexOutput {
              var vertexOutput: VertexOutput;
              vertexOutput.Position = vec4f(pos, 1.0);
              vertexOutput.fragColor = vec4f(1, 0, 0, 0);
              return vertexOutput;
          }

          @fragment
          fn fragmentMain(fragmentInput: VertexOutput) -> @location(0) vec4f {
            return fragmentInput.fragColor;
          }
        `
      });

      const cellPipeline = device.createRenderPipeline({
        label: "Cell pipeline",
        layout: "auto",
        vertex: {
          module: cellShaderModule,
          entryPoint: "vertexMain",
          buffers: [vertexBufferLayout]
        },
        fragment: {
          module: cellShaderModule,
          entryPoint: "fragmentMain",
          targets: [{
            format: canvasFormat
          }]
        }
      });

      const encoder = device.createCommandEncoder();

      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          loadOp: "clear",
          clearValue: { r: 0, g: 0, b: 0.4, a: 1 },
          storeOp: "store",
        }]
      });

      pass.setPipeline(cellPipeline);
      pass.setVertexBuffer(0, vertexBuffer);
      pass.setIndexBuffer(indexBuffer, "uint16");
      pass.drawIndexed(indices.length);

      pass.end();

      device.queue.submit([encoder.finish()]);

    </script>
  </body>
</html>
